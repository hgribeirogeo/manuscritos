<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LabResearch · EECA/UFG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d1117;
  --surface:#161b22;
  --surface2:#21262d;
  --surface3:#2d333b;
  --border:#30363d;
  --border2:#444c56;
  --text:#e6edf3;
  --text-muted:#8b949e;
  --text-dim:#6e7681;
  --green:#2ea043;
  --green-bright:#3fb950;
  --green-dim:#1a4a2e;
  --yellow:#d29922;
  --yellow-dim:#4a3800;
  --orange:#f0883e;
  --orange-dim:#4a2200;
  --red:#f85149;
  --red-dim:#4a1515;
  --blue:#58a6ff;
  --blue-dim:#1a3a5c;
  --purple:#bc8cff;
  --purple-dim:#2d1f4a;
  --teal:#39d3c3;
  --teal-dim:#0d3330;
  --pink:#ff7eb6;
  --pink-dim:#3d1428;
  --accent:#2ea043;
  --mono:'JetBrains Mono',monospace;
  --sans:'Inter',sans-serif;
  --radius:8px;
  --radius-sm:5px;
  --sidebar:220px;
}
html{font-size:14px;scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100vh;display:flex}

/* SIDEBAR */
.sidebar{width:var(--sidebar);min-height:100vh;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;position:fixed;top:0;left:0;z-index:100}
.sidebar-logo{padding:20px 16px 16px;border-bottom:1px solid var(--border)}
.sidebar-logo .brand{font-family:var(--mono);font-size:13px;font-weight:600;color:var(--green-bright);letter-spacing:0.05em}
.sidebar-logo .sub{font-size:10px;color:var(--text-dim);margin-top:2px;font-family:var(--mono)}
.sidebar-nav{flex:1;padding:12px 8px}
.nav-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--radius-sm);cursor:pointer;color:var(--text-muted);font-size:12.5px;font-weight:500;transition:all 0.15s;margin-bottom:2px;border:1px solid transparent;user-select:none}
.nav-item:hover{background:var(--surface2);color:var(--text)}
.nav-item.active{background:var(--green-dim);color:var(--green-bright);border-color:var(--green)33}
.nav-icon{font-size:14px;width:18px;text-align:center}
.sidebar-footer{padding:12px;border-top:1px solid var(--border)}
.sync-status{font-family:var(--mono);font-size:10px;color:var(--text-dim);display:flex;align-items:center;gap:6px}
.sync-dot{width:6px;height:6px;border-radius:50%;background:var(--text-dim);flex-shrink:0}
.sync-dot.ok{background:var(--green)}
.sync-dot.err{background:var(--red);animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}

/* MAIN */
.main{margin-left:var(--sidebar);flex:1;min-height:100vh;display:flex;flex-direction:column}
.topbar{padding:16px 28px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;background:var(--surface)cc;backdrop-filter:blur(8px);position:sticky;top:0;z-index:50}
.topbar-title{font-size:15px;font-weight:600;color:var(--text)}
.topbar-actions{display:flex;gap:8px;align-items:center}
.content{padding:24px 28px;flex:1}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:var(--radius-sm);font-size:12.5px;font-weight:500;cursor:pointer;border:1px solid;transition:all 0.15s;font-family:var(--sans)}
.btn-primary{background:var(--green);border-color:var(--green);color:#fff}
.btn-primary:hover{background:#26892f;border-color:#26892f}
.btn-secondary{background:transparent;border-color:var(--border2);color:var(--text-muted)}
.btn-secondary:hover{background:var(--surface2);color:var(--text);border-color:var(--text-dim)}
.btn-danger{background:transparent;border-color:var(--red)66;color:var(--red)}
.btn-danger:hover{background:var(--red-dim)}
.btn-sm{padding:4px 10px;font-size:11.5px}
.btn-icon{padding:6px 10px}

/* CARDS */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.card-header{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.card-body{padding:16px}

/* STATS ROW */
.stats-row{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:24px}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px}
.stat-value{font-family:var(--mono);font-size:26px;font-weight:600;color:var(--text);line-height:1}
.stat-label{font-size:11px;color:var(--text-muted);margin-top:5px;font-weight:500;text-transform:uppercase;letter-spacing:0.05em}
.stat-sub{font-family:var(--mono);font-size:10px;color:var(--text-dim);margin-top:4px}

/* STUDENT CARDS - DASHBOARD */
.students-grid{display:flex;flex-direction:column;gap:10px}
.student-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;display:grid;grid-template-columns:44px 1fr auto auto;align-items:center;gap:14px;cursor:pointer;transition:all 0.15s;position:relative;overflow:hidden}
.student-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px}
.student-card.risk-verde::before{background:var(--green)}
.student-card.risk-amarelo::before{background:var(--yellow)}
.student-card.risk-laranja::before{background:var(--orange)}
.student-card.risk-vermelho::before{background:var(--red)}
.student-card.risk-encerrado::before{background:var(--text-dim)}
.student-card:hover{border-color:var(--border2);background:var(--surface2);transform:translateX(2px)}
.student-avatar{width:44px;height:44px;border-radius:50%;background:var(--surface3);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:14px;font-weight:600;color:var(--text);border:2px solid var(--border)}
.student-info{min-width:0}
.student-name{font-size:14px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.student-meta{display:flex;align-items:center;gap:8px;margin-top:4px;flex-wrap:wrap}
.badge{font-family:var(--mono);font-size:9.5px;font-weight:600;padding:2px 7px;border-radius:20px;text-transform:uppercase;letter-spacing:0.06em}
.badge-ic{background:var(--blue-dim);color:var(--blue);border:1px solid var(--blue)33}
.badge-tcc{background:var(--purple-dim);color:var(--purple);border:1px solid var(--purple)33}
.badge-esp{background:var(--orange-dim);color:var(--orange);border:1px solid var(--orange)33}
.badge-msc{background:var(--teal-dim);color:var(--teal);border:1px solid var(--teal)33}
.badge-phd{background:var(--pink-dim);color:var(--pink);border:1px solid var(--pink)33}
.coori-tag{font-size:10px;font-family:var(--mono);color:var(--text-dim);display:flex;align-items:center;gap:4px;margin-top:3px}
.coori-tag span{color:var(--text-muted)}
.student-milestone{font-size:11.5px;color:var(--text-muted);margin-top:5px;display:flex;align-items:center;gap:6px}
.student-progress{width:160px}
.progress-track{height:4px;background:var(--surface3);border-radius:2px;overflow:hidden;margin-bottom:4px}
.progress-fill{height:100%;border-radius:2px;transition:width 0.4s ease}
.progress-fill.verde{background:linear-gradient(90deg,var(--green),var(--green-bright))}
.progress-fill.amarelo{background:linear-gradient(90deg,var(--yellow),#f0c040)}
.progress-fill.laranja{background:linear-gradient(90deg,var(--orange),#f0a050)}
.progress-fill.vermelho{background:linear(90deg,var(--red),#ff7070)}
.progress-fill.encerrado{background:var(--text-dim)}
.progress-label{font-family:var(--mono);font-size:9.5px;color:var(--text-dim);text-align:right}
.inactivity-badge{font-family:var(--mono);font-size:10px;padding:3px 8px;border-radius:20px;white-space:nowrap}
.inactivity-ok{background:var(--green-dim);color:var(--green-bright)}
.inactivity-warn{background:var(--yellow-dim);color:var(--yellow)}
.inactivity-alert{background:var(--orange-dim);color:var(--orange)}
.inactivity-crisis{background:var(--red-dim);color:var(--red)}

/* DETAIL VIEW */
.detail-view{display:none}
.detail-view.open{display:block}
.detail-back{display:inline-flex;align-items:center;gap:6px;color:var(--text-muted);font-size:12.5px;cursor:pointer;margin-bottom:20px;padding:6px 0;border:none;background:none;font-family:var(--sans)}
.detail-back:hover{color:var(--text)}
.detail-header{display:flex;align-items:flex-start;gap:18px;margin-bottom:24px}
.detail-avatar{width:64px;height:64px;border-radius:50%;background:var(--surface3);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:22px;font-weight:700;color:var(--text);border:3px solid var(--border2);flex-shrink:0}
.detail-info{flex:1}
.detail-name{font-size:20px;font-weight:700;color:var(--text)}
.detail-meta{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;align-items:center}
.detail-contact{font-size:12px;color:var(--text-muted);margin-top:4px}

/* PIPELINE */
.pipeline-section{margin-bottom:24px}
.section-title{font-size:12px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.section-title::after{content:'';flex:1;height:1px;background:var(--border)}
.pipeline{display:flex;gap:0;overflow-x:auto;padding-bottom:4px}
.pipeline-step{flex:1;min-width:90px;display:flex;flex-direction:column;align-items:center;position:relative;cursor:pointer}
.pipeline-step:not(:last-child)::after{content:'';position:absolute;top:14px;left:calc(50% + 14px);right:calc(-50% + 14px);height:2px;background:var(--border);z-index:0}
.pipeline-step.done:not(:last-child)::after,.pipeline-step.current:not(:last-child)::after{background:var(--green)66}
.pipeline-dot{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;font-family:var(--mono);position:relative;z-index:1;border:2px solid;transition:all 0.2s}
.pipeline-step.done .pipeline-dot{background:var(--green);border-color:var(--green);color:#fff}
.pipeline-step.current .pipeline-dot{background:var(--surface);border-color:var(--blue);color:var(--blue);box-shadow:0 0 0 4px var(--blue-dim)}
.pipeline-step.pending .pipeline-dot{background:var(--surface2);border-color:var(--border2);color:var(--text-dim)}
.pipeline-step-label{font-size:9.5px;color:var(--text-muted);text-align:center;margin-top:6px;line-height:1.3;max-width:85px;font-weight:500}
.pipeline-step.done .pipeline-step-label{color:var(--green)}
.pipeline-step.current .pipeline-step-label{color:var(--blue)}

/* MEETINGS LOG */
.meetings-list{display:flex;flex-direction:column;gap:8px;max-height:300px;overflow-y:auto}
.meeting-entry{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 12px;position:relative}
.meeting-date{font-family:var(--mono);font-size:10px;color:var(--text-dim);margin-bottom:4px}
.meeting-text{font-size:12.5px;color:var(--text-muted);line-height:1.5}
.meeting-del{position:absolute;top:8px;right:8px;background:none;border:none;color:var(--text-dim);cursor:pointer;font-size:12px;padding:2px 5px;border-radius:3px}
.meeting-del:hover{background:var(--red-dim);color:var(--red)}
.meeting-add{display:flex;gap:8px;margin-top:10px}
.meeting-add textarea{flex:1;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-family:var(--sans);font-size:12.5px;padding:8px 10px;resize:vertical;min-height:60px}
.meeting-add textarea:focus{outline:none;border-color:var(--blue)}

/* FORMS / MODALS */
.overlay{display:none;position:fixed;inset:0;background:#00000099;z-index:200;align-items:center;justify-content:center}
.overlay.open{display:flex}
.modal{background:var(--surface);border:1px solid var(--border2);border-radius:10px;width:520px;max-width:94vw;max-height:88vh;overflow-y:auto;display:flex;flex-direction:column}
.modal-header{padding:18px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--surface);z-index:1}
.modal-title{font-size:15px;font-weight:600}
.modal-close{background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:18px;padding:2px 6px;border-radius:4px}
.modal-close:hover{background:var(--surface2);color:var(--text)}
.modal-body{padding:20px;flex:1}
.modal-footer{padding:14px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px}
.form-group{margin-bottom:14px}
.form-label{font-size:11.5px;font-weight:600;color:var(--text-muted);margin-bottom:5px;display:block;text-transform:uppercase;letter-spacing:0.05em}
.form-control{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-family:var(--sans);font-size:13px;padding:8px 10px;transition:border-color 0.15s}
.form-control:focus{outline:none;border-color:var(--blue)}
.form-control option{background:var(--surface2)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* MANUSCRIPTS VIEW */
.manu-list{display:flex;flex-direction:column;gap:8px}
.manu-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;cursor:pointer;transition:all 0.15s}
.manu-card:hover{border-color:var(--border2);background:var(--surface2)}
.manu-title{font-size:13.5px;font-weight:600;color:var(--text)}
.manu-meta{display:flex;gap:8px;margin-top:5px;align-items:center;flex-wrap:wrap}
.manu-journal{font-size:11.5px;color:var(--text-muted)}
.steps-row{display:flex;gap:4px;margin-top:8px;flex-wrap:wrap}
.step-pill{font-family:var(--mono);font-size:9.5px;padding:2px 8px;border-radius:12px;border:1px solid}
.step-done{background:var(--green-dim);border-color:var(--green)44;color:var(--green-bright)}
.step-wip{background:var(--blue-dim);border-color:var(--blue)44;color:var(--blue)}
.step-pend{background:var(--surface3);border-color:var(--border);color:var(--text-dim)}

/* ALERTS PANEL */
.alerts-list{display:flex;flex-direction:column;gap:8px}
.alert-item{display:flex;align-items:flex-start;gap:12px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 14px}
.alert-dot-wrap{padding-top:3px}
.alert-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.alert-text{font-size:12.5px;color:var(--text-muted);line-height:1.5}
.alert-text strong{color:var(--text)}
.empty-state{text-align:center;padding:48px 20px;color:var(--text-dim);font-size:13px}
.empty-icon{font-size:32px;margin-bottom:12px}

/* CALENDAR */
.calendar-list{display:flex;flex-direction:column;gap:8px}
.cal-item{display:flex;gap:14px;align-items:center;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 14px}
.cal-date{font-family:var(--mono);font-size:11px;color:var(--text-muted);width:72px;flex-shrink:0}
.cal-label{font-size:13px;font-weight:500;color:var(--text)}
.cal-sub{font-size:11.5px;color:var(--text-muted);margin-top:2px}
.cal-past{opacity:0.45}
.cal-soon{border-color:var(--orange)66}

/* TOAST */
.toast-wrap{position:fixed;bottom:24px;right:24px;z-index:999;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--surface2);border:1px solid var(--border2);border-radius:var(--radius-sm);padding:10px 16px;font-size:12.5px;color:var(--text);box-shadow:0 8px 32px #00000066;animation:fadeIn 0.2s ease;font-family:var(--sans)}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.scroll-hint{font-size:9.5px;color:var(--text-dim);font-family:var(--mono);padding-left:4px;margin-top:2px}
</style>
</head>
<body>

<!-- SIDEBAR -->
<aside class="sidebar">
  <div class="sidebar-logo">
    <div class="brand">LAB/RESEARCH</div>
    <div class="sub">EECA · UFG</div>
  </div>
  <nav class="sidebar-nav">
    <div class="nav-item active" onclick="showView('dashboard')" id="nav-dashboard">
      <span class="nav-icon">⬡</span> Dashboard
    </div>
    <div class="nav-item" onclick="showView('orientandos')" id="nav-orientandos">
      <span class="nav-icon">◎</span> Orientandos
    </div>
    <div class="nav-item" onclick="showView('manuscritos')" id="nav-manuscritos">
      <span class="nav-icon">◈</span> Manuscritos
    </div>
    <div class="nav-item" onclick="showView('calendario')" id="nav-calendario">
      <span class="nav-icon">◷</span> Calendário
    </div>
    <div class="nav-item" onclick="showView('alertas')" id="nav-alertas">
      <span class="nav-icon">◬</span> Alertas <span id="alert-count" style="margin-left:auto;font-family:var(--mono);font-size:9px;background:var(--red);color:#fff;border-radius:10px;padding:1px 5px;display:none"></span>
    </div>
    <div class="nav-item" onclick="showView('configuracoes')" id="nav-configuracoes" style="margin-top:auto">
      <span class="nav-icon">⚙</span> Configurações
    </div>
  </nav>
  <div class="sidebar-footer">
    <div class="sync-status"><span class="sync-dot" id="syncDot"></span><span id="syncText">Verificando...</span></div>
  </div>
</aside>

<!-- MAIN -->
<main class="main">
  <div class="topbar">
    <div class="topbar-title" id="topbarTitle">Dashboard</div>
    <div class="topbar-actions">
      <button class="btn btn-secondary btn-sm" onclick="syncNow()">↻ Sincronizar</button>
      <button class="btn btn-primary btn-sm" id="topbarAdd" onclick="openAddStudentModal()">+ Orientando</button>
    </div>
  </div>

  <div class="content">

    <!-- DASHBOARD -->
    <div id="view-dashboard">
      <div class="stats-row" id="statsRow"></div>
      <div class="students-grid" id="dashboardGrid"></div>
    </div>

    <!-- ORIENTANDOS (lista filtrada) -->
    <div id="view-orientandos" style="display:none">
      <div style="display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap">
        <button class="btn btn-secondary btn-sm" onclick="filterStudents('todos')" id="f-todos">Todos</button>
        <button class="btn btn-secondary btn-sm" onclick="filterStudents('IC')" id="f-IC">IC</button>
        <button class="btn btn-secondary btn-sm" onclick="filterStudents('TCC')" id="f-TCC">TCC Graduação</button>
        <button class="btn btn-secondary btn-sm" onclick="filterStudents('ESP')" id="f-ESP">TCC Especialização</button>
        <button class="btn btn-secondary btn-sm" onclick="filterStudents('MSC')" id="f-MSC">Mestrado</button>
        <button class="btn btn-secondary btn-sm" onclick="filterStudents('PHD')" id="f-PHD">Doutorado</button>
        <button class="btn btn-secondary btn-sm" onclick="filterStudents('encerrado')" id="f-enc">Encerrados</button>
      </div>
      <div class="students-grid" id="orientandosGrid"></div>
    </div>

    <!-- DETAIL do orientando -->
    <div id="view-student-detail" style="display:none">
      <button class="detail-back" onclick="backFromDetail()">← Voltar</button>
      <div id="studentDetailContent"></div>
    </div>

    <!-- MANUSCRITOS -->
    <div id="view-manuscritos" style="display:none">
      <div style="margin-bottom:14px;display:flex;gap:8px">
        <button class="btn btn-secondary btn-sm" onclick="filterManu('todos')" id="fm-todos">Todos</button>
        <button class="btn btn-secondary btn-sm" onclick="filterManu('IC')" id="fm-IC">IC</button>
        <button class="btn btn-secondary btn-sm" onclick="filterManu('TCC')" id="fm-TCC">TCC Grad</button>
        <button class="btn btn-secondary btn-sm" onclick="filterManu('ESP')" id="fm-ESP">TCC Esp</button>
        <button class="btn btn-primary btn-sm" onclick="openAddManuModal()" style="margin-left:auto">+ Manuscrito</button>
      </div>
      <div class="manu-list" id="manuList"></div>
    </div>

    <!-- MANUSCRITO DETAIL -->
    <div id="view-manu-detail" style="display:none">
      <button class="detail-back" onclick="backFromManuDetail()">← Voltar</button>
      <div id="manuDetailContent"></div>
    </div>

    <!-- CALENDÁRIO -->
    <div id="view-calendario" style="display:none">
      <div class="calendar-list" id="calendarList"></div>
    </div>

    <!-- ALERTAS -->
    <div id="view-alertas" style="display:none">
      <div class="alerts-list" id="alertsList"></div>
    </div>

    <!-- CONFIGURAÇÕES -->
    <div id="view-configuracoes" style="display:none">
      <div class="card" style="max-width:480px">
        <div class="card-header"><span style="font-size:13px;font-weight:600">Sincronização — GitHub Gist</span></div>
        <div class="card-body">
          <div class="form-group">
            <label class="form-label">Gist ID</label>
            <input type="text" class="form-control" id="cfgGistId" placeholder="e5d141b42a27db388a7d1f684c78e3f0">
          </div>
          <div class="form-group">
            <label class="form-label">GitHub Token (PAT)</label>
            <input type="password" class="form-control" id="cfgToken" placeholder="ghp_...">

<!-- TOAST -->
<div class="toast-wrap" id="toastWrap"></div>

<script>
// ─── CONFIG ───────────────────────────────────────────────────
const DEFAULT_GIST_ID = 'e5d141b42a27db388a7d1f684c78e3f0';
const GIST_FILENAME_S = 'labresearch_students.json';
const GIST_FILENAME_M = 'labresearch_manuscripts.json';

let cfg = {
  gistId: DEFAULT_GIST_ID,
  token: '',
  warnDays: 14,
  alertDays: 30
};

// ─── PIPELINES ────────────────────────────────────────────────
const PIPELINES = {
  IC:  ['Plano de Trabalho','Coleta de Dados','Análise','Relatório Parcial','Relatório Final PIBIC/PIVIC','Encerrado'],
  TCC: ['Proposta','TCC 1 (Banca)','Correções Pós-TCC1','Coleta / Análise','Escrita','TCC 2 (Defesa)','Entregue'],
  ESP: ['Projeto','Escrita','Defesa','Entregue'],
  MSC: ['Proposta','Qualificação','Correções Pós-Qualif.','Coleta / Análise','Escrita','Defesa','Entregue'],
  PHD: ['Proposta','Qualificação','Correções Pós-Qualif.','Coleta / Análise','Escrita','Pré-defesa','Defesa','Entregue']
};

const MANU_STEPS = ['Resumo','Introdução','Materiais e Métodos','Resultados','Discussão','Conclusão','Referências','Submetido'];

// ─── DATA ─────────────────────────────────────────────────────
let students = [];
let manuscripts = [];
let currentView = 'dashboard';
let detailStudentId = null;
let detailManuId = null;
let prevView = null;

// ─── STORAGE ──────────────────────────────────────────────────
function loadCfg(){
  try{const c=JSON.parse(localStorage.getItem('labcfg')||'{}');Object.assign(cfg,c);}catch(e){}
}
function saveCfg(){localStorage.setItem('labcfg',JSON.stringify(cfg));}

async function loadData(){
  loadCfg();
  if(cfg.gistId && cfg.token){
    try{
      const r=await fetch(`https://api.github.com/gists/${cfg.gistId}`,{headers:{Authorization:`token ${cfg.token}`}});
      if(r.ok){
        const g=await r.json();
        if(g.files[GIST_FILENAME_S]) students=JSON.parse(g.files[GIST_FILENAME_S].content||'[]');
        if(g.files[GIST_FILENAME_M]) manuscripts=JSON.parse(g.files[GIST_FILENAME_M].content||'[]');
        setSyncOk(); return;
      }
    }catch(e){}
  }
  // fallback localStorage
  try{students=JSON.parse(localStorage.getItem('labstudents')||'[]');}catch(e){students=[];}
  try{manuscripts=JSON.parse(localStorage.getItem('labmanuscripts')||'[]');}catch(e){manuscripts=[];}
  setSyncWarn();
}

async function saveData(){
  localStorage.setItem('labstudents',JSON.stringify(students));
  localStorage.setItem('labmanuscripts',JSON.stringify(manuscripts));
  if(cfg.gistId && cfg.token){
    try{
      const files={};
      files[GIST_FILENAME_S]={content:JSON.stringify(students,null,2)};
      files[GIST_FILENAME_M]={content:JSON.stringify(manuscripts,null,2)};
      const r=await fetch(`https://api.github.com/gists/${cfg.gistId}`,{
        method:'PATCH',headers:{'Content-Type':'application/json',Authorization:`token ${cfg.token}`},
        body:JSON.stringify({files})
      });
      if(r.ok){setSyncOk();return;}
    }catch(e){}
    setSyncErr();
  }
}

function setSyncOk(){document.getElementById('syncDot').className='sync-dot ok';document.getElementById('syncText').textContent='Sincronizado';}
function setSyncWarn(){document.getElementById('syncDot').className='sync-dot';document.getElementById('syncText').textContent='Local (sem Gist)';}
function setSyncErr(){document.getElementById('syncDot').className='sync-dot err';document.getElementById('syncText').textContent='Erro de sync';}

async function syncNow(){toast('Sincronizando...');await loadData();renderCurrentView();}

// ─── VIEWS ────────────────────────────────────────────────────
function showView(v, skipHistory=false){
  if(!skipHistory) prevView=currentView;
  document.querySelectorAll('[id^="view-"]').forEach(el=>el.style.display='none');
  document.querySelectorAll('.nav-item').forEach(el=>el.classList.remove('active'));
  const el=document.getElementById('view-'+v);
  if(el) el.style.display='';
  const nav=document.getElementById('nav-'+v);
  if(nav) nav.classList.add('active');
  currentView=v;
  const titles={dashboard:'Dashboard',orientandos:'Orientandos',manuscritos:'Manuscritos',calendario:'Calendário de Bancas',alertas:'Alertas',configuracoes:'Configurações','student-detail':'Orientando','manu-detail':'Manuscrito'};
  document.getElementById('topbarTitle').textContent=titles[v]||v;
  document.getElementById('topbarAdd').textContent=v==='manuscritos'?'+ Manuscrito':'+ Orientando';
  document.getElementById('topbarAdd').onclick=v==='manuscritos'?()=>openAddManuModal():()=>openAddStudentModal();
  renderCurrentView();
}

function renderCurrentView(){
  if(currentView==='dashboard') renderDashboard();
  else if(currentView==='orientandos') renderOrientandos('todos');
  else if(currentView==='manuscritos') renderManuscritos('todos');
  else if(currentView==='calendario') renderCalendario();
  else if(currentView==='alertas') renderAlertas();
  else if(currentView==='configuracoes') renderConfig();
  updateAlertBadge();
}

// ─── RISK LOGIC ───────────────────────────────────────────────
function inactivityDays(s){
  if(!s.lastMeet) return 9999;
  return Math.floor((Date.now()-new Date(s.lastMeet).getTime())/(86400000));
}

function riskLevel(s){
  if(s.encerrado || (s.milestone && s.milestone.toLowerCase().includes('encerrado')) || (s.milestone && s.milestone.toLowerCase().includes('entregue'))) return 'encerrado';
  const d=inactivityDays(s);
  if(d>=cfg.alertDays) return 'vermelho';
  if(d>=cfg.warnDays) return 'amarelo';
  if(d>=7) return 'laranja';
  return 'verde';
}

function riskColor(r){return{verde:'var(--green)',amarelo:'var(--yellow)',laranja:'var(--orange)',vermelho:'var(--red)',encerrado:'var(--text-dim)'}[r]||'var(--text-dim)';}

function inactivityLabel(s){
  if(s.encerrado) return {cls:'inactivity-ok',txt:'Encerrado'};
  const d=inactivityDays(s);
  if(d===9999) return{cls:'inactivity-crisis',txt:'Sem registro'};
  if(d===0) return{cls:'inactivity-ok',txt:'Hoje'};
  if(d<=7) return{cls:'inactivity-ok',txt:`${d}d atrás`};
  if(d<=cfg.warnDays) return{cls:'inactivity-warn',txt:`${d}d atrás`};
  if(d<=cfg.alertDays) return{cls:'inactivity-alert',txt:`${d}d atrás`};
  return{cls:'inactivity-crisis',txt:`${d}d atrás`};
}

function pipelineProgress(s){
  const steps=PIPELINES[s.type]||PIPELINES.TCC;
  const idx=steps.indexOf(s.milestone);
  if(idx<0) return 0;
  return Math.round((idx/Math.max(steps.length-1,1))*100);
}

function initials(name){if(!name) return '?';const p=name.trim().split(' ');return(p[0][0]+(p[1]?p[1][0]:'')).toUpperCase();}

function typeBadge(t){
  if(t==='IC')  return '<span class="badge badge-ic">IC</span>';
  if(t==='TCC') return '<span class="badge badge-tcc">TCC Grad</span>';
  if(t==='ESP') return '<span class="badge badge-esp">TCC Esp</span>';
  if(t==='MSC') return '<span class="badge badge-msc">Mestrado</span>';
  if(t==='PHD') return '<span class="badge badge-phd">Doutorado</span>';
  return '<span class="badge badge-tcc">'+t+'</span>';
}

// ─── DASHBOARD ────────────────────────────────────────────────
function renderDashboard(){
  const active=students.filter(s=>!s.encerrado);
  const enc=students.filter(s=>s.encerrado);
  const alertas=students.filter(s=>!s.encerrado && inactivityDays(s)>=cfg.warnDays);
  document.getElementById('statsRow').innerHTML=`
    <div class="stat-card"><div class="stat-value">${active.length}</div><div class="stat-label">Orientandos ativos</div><div class="stat-sub">${enc.length} encerrados</div></div>
    <div class="stat-card"><div class="stat-value">${students.filter(s=>s.type==='IC').length}</div><div class="stat-label">IC</div><div class="stat-sub">Iniciação Científica</div></div>
    <div class="stat-card"><div class="stat-value">${students.filter(s=>s.type==='TCC'||s.type==='ESP').length}</div><div class="stat-label">TCCs</div><div class="stat-sub">Grad + Especialização</div></div>
    <div class="stat-card"><div class="stat-value">${students.filter(s=>s.type==='MSC'||s.type==='PHD').length}</div><div class="stat-label">Pós-Grad</div><div class="stat-sub">Mestrado + Doutorado</div></div>
    <div class="stat-card" style="border-color:${alertas.length>0?'var(--orange)44':'var(--border)'}"><div class="stat-value" style="color:${alertas.length>0?'var(--orange)':'var(--text)'}">${alertas.length}</div><div class="stat-label">Requerem atenção</div><div class="stat-sub">Inatividade ≥${cfg.warnDays}d</div></div>
  `;
  const sorted=[...students].sort((a,b)=>{
    const order={vermelho:0,laranja:1,amarelo:2,verde:3,encerrado:4};
    return (order[riskLevel(a)]||3)-(order[riskLevel(b)]||3);
  });
  document.getElementById('dashboardGrid').innerHTML=sorted.map(s=>studentCardHTML(s)).join('')||'<div class="empty-state"><div class="empty-icon">◎</div>Nenhum orientando cadastrado.<br><br><button class="btn btn-primary" onclick="openAddStudentModal()">+ Adicionar primeiro orientando</button></div>';
}

function studentCardHTML(s){
  const risk=riskLevel(s);
  const pct=pipelineProgress(s);
  const il=inactivityLabel(s);
  const cooriLine=(s.type==='MSC'||s.type==='PHD')&&s.advisor
    ?`<div class="coori-tag">coorient. de <span>${escHTML(s.advisor)}</span>${s.program?' · '+escHTML(s.program):''}</div>`:'';
  return `<div class="student-card risk-${risk}" onclick="openStudentDetail('${s.id}')">
    <div class="student-avatar">${initials(s.name)}</div>
    <div class="student-info">
      <div class="student-name">${s.name||'—'}</div>
      <div class="student-meta">${typeBadge(s.type)}<span style="font-size:11px;color:var(--text-muted)">${s.theme||''}</span></div>
      ${cooriLine}
      <div class="student-milestone"><span style="color:${riskColor(risk)};font-size:10px">●</span>${s.milestone||'Sem etapa'}</div>
    </div>
    <div class="student-progress">
      <div class="progress-track"><div class="progress-fill ${risk}" style="width:${pct}%"></div></div>
      <div class="progress-label">${pct}%</div>
    </div>
    <span class="inactivity-badge ${il.cls}">${il.txt}</span>
  </div>`;
}

// ─── ORIENTANDOS ──────────────────────────────────────────────
let currentFilter='todos';
function renderOrientandos(f){
  currentFilter=f;
  ['todos','IC','TCC','ESP','MSC','PHD','encerrado'].forEach(k=>{
    const b=document.getElementById('f-'+k);
    if(b) b.className='btn btn-'+(k===f?'primary':'secondary')+' btn-sm';
  });
  let list=students;
  if(f==='encerrado') list=students.filter(s=>s.encerrado);
  else if(f!=='todos') list=students.filter(s=>s.type===f&&!s.encerrado);
  else list=students.filter(s=>!s.encerrado);
  document.getElementById('orientandosGrid').innerHTML=list.map(s=>studentCardHTML(s)).join('')||'<div class="empty-state"><div class="empty-icon">◎</div>Nenhum orientando nesta categoria.</div>';
}

function filterStudents(f){renderOrientandos(f);}

// ─── STUDENT DETAIL ───────────────────────────────────────────
function openStudentDetail(id){
  detailStudentId=id;
  prevView=currentView;
  showView('student-detail',true);
  renderStudentDetail(id);
  document.getElementById('nav-'+prevView)&&document.getElementById('nav-'+prevView).classList.remove('active');
}

function backFromDetail(){showView(prevView||'dashboard',true);}

function renderStudentDetail(id){
  const s=students.find(x=>x.id===id);if(!s) return;
  const steps=PIPELINES[s.type]||PIPELINES.TCC;
  const curIdx=steps.indexOf(s.milestone);
  const il=inactivityLabel(s);
  const pipeHTML=steps.map((step,i)=>{
    const state=i<curIdx?'done':i===curIdx?'current':'pending';
    return `<div class="pipeline-step ${state}" onclick="setMilestone('${id}','${step}')"><div class="pipeline-dot">${state==='done'?'✓':i+1}</div><div class="pipeline-step-label">${step}</div></div>`;
  }).join('');

  const meetings=s.meetings||[];
  const meetingsHTML=meetings.length?meetings.slice().reverse().map((m,i)=>`
    <div class="meeting-entry">
      <div class="meeting-date">${m.date}</div>
      <div class="meeting-text">${escHTML(m.text)}</div>
      <button class="meeting-del" onclick="deleteMeeting('${id}',${meetings.length-1-i})">✕</button>
    </div>`).join(''):'<div style="color:var(--text-dim);font-size:12px;padding:8px 0">Nenhuma reunião registrada.</div>';

  document.getElementById('studentDetailContent').innerHTML=`
    <div class="detail-header">
      <div class="detail-avatar">${initials(s.name)}</div>
      <div class="detail-info">
        <div class="detail-name">${s.name}</div>
        <div class="detail-meta">${typeBadge(s.type)}
          <span class="inactivity-badge ${il.cls}">${il.txt}</span>
          ${s.encerrado?'<span class="badge" style="background:var(--surface3);color:var(--text-dim);border:1px solid var(--border)">ENCERRADO</span>':''}
        </div>
        <div class="detail-contact">${s.email||''}${s.email&&s.phone?' · ':''}${s.phone||''}</div>
      </div>
      <div style="display:flex;gap:8px">
        <button class="btn btn-secondary btn-sm" onclick="openEditStudentModal('${id}')">✎ Editar</button>
        ${!s.encerrado?`<button class="btn btn-secondary btn-sm" onclick="toggleEncerrado('${id}')">✓ Encerrar</button>`:`<button class="btn btn-secondary btn-sm" onclick="toggleEncerrado('${id}')">↩ Reabrir</button>`}
      </div>
    </div>

    ${s.theme?`<div style="background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 14px;margin-bottom:20px;font-size:13px;color:var(--text-muted)"><span style="font-size:10px;font-weight:600;color:var(--text-dim);text-transform:uppercase;letter-spacing:.06em;display:block;margin-bottom:4px">Tema</span>${escHTML(s.theme)}</div>`:''}

    <div class="pipeline-section">
      <div class="section-title">Pipeline</div>
      <div class="pipeline">${pipeHTML}</div>
      <div class="scroll-hint">Clique em uma etapa para atualizar</div>
    </div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px">
      <div>
        <div class="section-title">Detalhes</div>
        <div style="display:flex;flex-direction:column;gap:7px">
          ${infoRow('Matrícula',s.matricula)}
          ${infoRow('Início',fmtDate(s.start))}
          ${infoRow('Prazo',fmtDate(s.end))}
          ${infoRow('Bolsa',s.grant)}
          ${ (s.type==='MSC'||s.type==='PHD') ? infoRow('Orient. principal',s.advisor||'—') : '' }
          ${ (s.type==='MSC'||s.type==='PHD') ? infoRow('Programa',s.program||'—') : '' }
        </div>
      </div>
      <div>
        <div class="section-title">Última reunião</div>
        <div style="display:flex;flex-direction:column;gap:8px">
          <div style="font-family:var(--mono);font-size:13px;color:var(--text)">${s.lastMeet?fmtDate(s.lastMeet):'—'}</div>
          <div style="display:flex;gap:6px;align-items:center">
            <input type="date" class="form-control" id="newMeetDate" style="width:auto;font-size:12px" value="${today()}">
            <button class="btn btn-secondary btn-sm" onclick="updateLastMeet('${id}')">Atualizar</button>
          </div>
        </div>
      </div>
    </div>

    ${s.notes?`<div class="pipeline-section"><div class="section-title">Observações</div><div style="font-size:12.5px;color:var(--text-muted);line-height:1.6;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 14px">${escHTML(s.notes)}</div></div>`:''}

    <div class="pipeline-section">
      <div class="section-title">Log de reuniões</div>
      <div class="meetings-list">${meetingsHTML}</div>
      <div class="meeting-add" style="margin-top:12px">
        <textarea id="newMeetText" placeholder="Resumo da reunião..."></textarea>
        <button class="btn btn-primary btn-sm" onclick="addMeeting('${id}')">+ Adicionar</button>
      </div>
    </div>
  `;
}

function infoRow(label,val){
  if(!val) return '';
  return `<div style="display:flex;gap:8px;align-items:baseline"><span style="font-size:10px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.05em;width:60px;flex-shrink:0">${label}</span><span style="font-size:12.5px;color:var(--text-muted)">${val}</span></div>`;
}

function setMilestone(id,step){
  const s=students.find(x=>x.id===id);if(!s)return;
  s.milestone=step;
  saveData();
  renderStudentDetail(id);
  toast(`Etapa atualizada: ${step}`);
}

function toggleEncerrado(id){
  const s=students.find(x=>x.id===id);if(!s)return;
  s.encerrado=!s.encerrado;
  saveData();
  renderStudentDetail(id);
  toast(s.encerrado?'Orientando marcado como encerrado':'Orientando reaberto');
}

function updateLastMeet(id){
  const s=students.find(x=>x.id===id);if(!s)return;
  const d=document.getElementById('newMeetDate').value;
  if(!d)return;
  s.lastMeet=d;
  saveData();
  renderStudentDetail(id);
  toast('Data de última reunião atualizada');
}

function addMeeting(id){
  const s=students.find(x=>x.id===id);if(!s)return;
  const txt=document.getElementById('newMeetText').value.trim();
  if(!txt)return;
  if(!s.meetings) s.meetings=[];
  s.meetings.push({date:today(),text:txt});
  s.lastMeet=today();
  saveData();
  renderStudentDetail(id);
  toast('Reunião registrada');
}

function deleteMeeting(id,idx){
  const s=students.find(x=>x.id===id);if(!s||!s.meetings)return;
  s.meetings.splice(idx,1);
  saveData();
  renderStudentDetail(id);
}

// ─── STUDENTS MODAL ───────────────────────────────────────────
function updatePipelineOptions(){
  const type=document.getElementById('sType').value;
  const sel=document.getElementById('sMilestone');
  const steps=PIPELINES[type]||PIPELINES.TCC;
  sel.innerHTML=steps.map(s=>`<option value="${s}">${s}</option>`).join('');
  const isCoori=type==='MSC'||type==='PHD';
  document.getElementById('cooriGroup').style.display=isCoori?'block':'none';
}

function openAddStudentModal(){
  document.getElementById('modalStudentTitle').textContent='Novo Orientando';
  document.getElementById('sId').value='';
  document.getElementById('sName').value='';
  document.getElementById('sMatricula').value='';
  document.getElementById('sType').value='TCC';
  document.getElementById('sEmail').value='';
  document.getElementById('sPhone').value='';
  document.getElementById('sStart').value=today();
  document.getElementById('sEnd').value='';
  document.getElementById('sTheme').value='';
  document.getElementById('sGrant').value='';
  document.getElementById('sAdvisor').value='';
  document.getElementById('sProgram').value='';
  document.getElementById('sLastMeet').value='';
  document.getElementById('sNotes').value='';
  document.getElementById('btnDeleteStudent').style.display='none';
  updatePipelineOptions();
  openModal('modalStudent');
}

function openEditStudentModal(id){
  const s=students.find(x=>x.id===id);if(!s)return;
  document.getElementById('modalStudentTitle').textContent='Editar Orientando';
  document.getElementById('sId').value=s.id;
  document.getElementById('sName').value=s.name||'';
  document.getElementById('sMatricula').value=s.matricula||'';
  document.getElementById('sType').value=s.type||'TCC';
  document.getElementById('sEmail').value=s.email||'';
  document.getElementById('sPhone').value=s.phone||'';
  document.getElementById('sStart').value=s.start||'';
  document.getElementById('sEnd').value=s.end||'';
  document.getElementById('sTheme').value=s.theme||'';
  document.getElementById('sGrant').value=s.grant||'';
  document.getElementById('sAdvisor').value=s.advisor||'';
  document.getElementById('sProgram').value=s.program||'';
  document.getElementById('sLastMeet').value=s.lastMeet||'';
  document.getElementById('sNotes').value=s.notes||'';
  document.getElementById('btnDeleteStudent').style.display='inline-flex';
  updatePipelineOptions();
  document.getElementById('sMilestone').value=s.milestone||PIPELINES[s.type||'TCC'][0];
  openModal('modalStudent');
}

function saveStudent(){
  const id=document.getElementById('sId').value||uid();
  const type=document.getElementById('sType').value;
  const data={
    id,name:document.getElementById('sName').value.trim(),
    matricula:document.getElementById('sMatricula').value.trim(),
    type,milestone:document.getElementById('sMilestone').value,
    email:document.getElementById('sEmail').value.trim(),
    phone:document.getElementById('sPhone').value.trim(),
    start:document.getElementById('sStart').value,
    end:document.getElementById('sEnd').value,
    theme:document.getElementById('sTheme').value.trim(),
    grant:document.getElementById('sGrant').value.trim(),
    advisor:document.getElementById('sAdvisor').value.trim(),
    program:document.getElementById('sProgram').value.trim(),
    lastMeet:document.getElementById('sLastMeet').value,
    notes:document.getElementById('sNotes').value.trim()
  };
  if(!data.name){toast('Informe o nome do orientando.');return;}
  const existing=students.findIndex(s=>s.id===id);
  if(existing>=0) Object.assign(students[existing],data);
  else{data.meetings=[];students.push(data);}
  saveData();
  closeModal('modalStudent');
  renderCurrentView();
  toast('Orientando salvo.');
}

function deleteStudent(){
  const id=document.getElementById('sId').value;
  if(!id) return;
  if(!confirm('Excluir este orientando? Esta ação não pode ser desfeita.')) return;
  students=students.filter(s=>s.id!==id);
  saveData();
  closeModal('modalStudent');
  if(currentView==='student-detail') backFromDetail();
  else renderCurrentView();
  toast('Orientando excluído.');
}

// ─── MANUSCRITOS ──────────────────────────────────────────────
function renderManuscritos(f){
  ['todos','IC','TCC','ESP'].forEach(k=>{
    const b=document.getElementById('fm-'+k);
    if(b) b.className='btn btn-'+(k===f?'primary':'secondary')+' btn-sm';
  });
  let list=manuscripts;
  if(f!=='todos') list=manuscripts.filter(m=>m.type===f);
  const el=document.getElementById('manuList');
  if(!list.length){el.innerHTML='<div class="empty-state"><div class="empty-icon">◈</div>Nenhum manuscrito cadastrado.<br><br><button class="btn btn-primary" onclick="openAddManuModal()">+ Adicionar primeiro manuscrito</button></div>';return;}
  el.innerHTML=list.map(m=>{
    const done=(m.steps||[]).filter(Boolean).length;
    const stepsHTML=MANU_STEPS.map(st=>{
      const isDone=(m.steps||[]).includes(st);
      return `<span class="step-pill ${isDone?'step-done':'step-pend'}">${st}</span>`;
    }).join('');
    return `<div class="manu-card" onclick="openManuDetail('${m.id}')">
      <div class="manu-title">${escHTML(m.title||'Sem título')}</div>
      <div class="manu-meta">${typeBadge(m.type)}<span class="manu-journal">${m.journal||''}</span><span style="font-size:11px;color:var(--text-muted)">${m.authors||''}</span></div>
      <div class="steps-row">${stepsHTML}</div>
    </div>`;
  }).join('');
}

function filterManu(f){renderManuscritos(f);}

function openManuDetail(id){
  detailManuId=id;
  prevView=currentView;
  showView('manu-detail',true);
  renderManuDetail(id);
}

function backFromManuDetail(){showView(prevView||'manuscritos',true);}

function renderManuDetail(id){
  const m=manuscripts.find(x=>x.id===id);if(!m)return;
  const stepsHTML=MANU_STEPS.map(st=>{
    const isDone=(m.steps||[]).includes(st);
    return `<label style="display:flex;align-items:center;gap:8px;cursor:pointer;padding:8px 10px;border-radius:var(--radius-sm);border:1px solid ${isDone?'var(--green)44':'var(--border)'};background:${isDone?'var(--green-dim)':'var(--surface2)'};margin-bottom:5px">
      <input type="checkbox" ${isDone?'checked':''} onchange="toggleManuStep('${id}','${st}',this.checked)" style="accent-color:var(--green)">
      <span style="font-size:13px;color:${isDone?'var(--green-bright)':'var(--text-muted)'}">${st}</span>
    </label>`;
  }).join('');
  document.getElementById('manuDetailContent').innerHTML=`
    <div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:20px;gap:12px">
      <div>
        <div style="font-size:18px;font-weight:700;color:var(--text)">${escHTML(m.title||'Sem título')}</div>
        <div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;align-items:center">${typeBadge(m.type)}<span style="font-size:12px;color:var(--text-muted)">${m.journal||''}</span><span style="font-size:12px;color:var(--text-muted)">${m.authors||''}</span></div>
      </div>
      <div style="display:flex;gap:8px;flex-shrink:0">
        <button class="btn btn-secondary btn-sm" onclick="openEditManuModal('${id}')">✎ Editar</button>
        <button class="btn btn-secondary btn-sm" onclick="openGDocs('${id}')">↗ Google Docs</button>
      </div>
    </div>
    <div class="pipeline-section"><div class="section-title">Etapas de escrita</div>${stepsHTML}</div>
    ${m.notes?`<div class="pipeline-section"><div class="section-title">Notas</div><div style="font-size:12.5px;color:var(--text-muted);line-height:1.6;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 14px">${escHTML(m.notes)}</div></div>`:''}
  `;
}

function toggleManuStep(id,step,checked){
  const m=manuscripts.find(x=>x.id===id);if(!m)return;
  if(!m.steps) m.steps=[];
  if(checked && !m.steps.includes(step)) m.steps.push(step);
  else if(!checked) m.steps=m.steps.filter(s=>s!==step);
  saveData();
}

function openGDocs(id){
  const m=manuscripts.find(x=>x.id===id);if(!m)return;
  navigator.clipboard.writeText(m.title||'').catch(()=>{});
  window.open(`https://docs.google.com/document/create?title=${encodeURIComponent(m.title||'Manuscrito')}`,'_blank');
  toast('Abrindo Google Docs...');
}

function openAddManuModal(){
  document.getElementById('modalManuTitle').textContent='Novo Manuscrito';
  document.getElementById('mId').value='';
  document.getElementById('mTitle').value='';
  document.getElementById('mJournal').value='';
  document.getElementById('mType').value='IC';
  document.getElementById('mAuthors').value='';
  document.getElementById('mNotes').value='';
  document.getElementById('btnDeleteManu').style.display='none';
  renderManuStepsCheck([]);
  openModal('modalManu');
}

function openEditManuModal(id){
  const m=manuscripts.find(x=>x.id===id);if(!m)return;
  document.getElementById('modalManuTitle').textContent='Editar Manuscrito';
  document.getElementById('mId').value=m.id;
  document.getElementById('mTitle').value=m.title||'';
  document.getElementById('mJournal').value=m.journal||'';
  document.getElementById('mType').value=m.type||'IC';
  document.getElementById('mAuthors').value=m.authors||'';
  document.getElementById('mNotes').value=m.notes||'';
  document.getElementById('btnDeleteManu').style.display='inline-flex';
  renderManuStepsCheck(m.steps||[]);
  openModal('modalManu');
}

function renderManuStepsCheck(done){
  document.getElementById('mStepsCheck').innerHTML=MANU_STEPS.map(st=>`
    <label style="display:flex;align-items:center;gap:5px;cursor:pointer;font-size:12px;color:var(--text-muted)">
      <input type="checkbox" ${done.includes(st)?'checked':''} value="${st}" style="accent-color:var(--green)"> ${st}
    </label>`).join('');
}

function saveManu(){
  const id=document.getElementById('mId').value||uid();
  const steps=Array.from(document.querySelectorAll('#mStepsCheck input:checked')).map(i=>i.value);
  const data={id,title:document.getElementById('mTitle').value.trim(),journal:document.getElementById('mJournal').value.trim(),type:document.getElementById('mType').value,authors:document.getElementById('mAuthors').value.trim(),notes:document.getElementById('mNotes').value.trim(),steps};
  if(!data.title){toast('Informe o título.');return;}
  const ei=manuscripts.findIndex(m=>m.id===id);
  if(ei>=0) Object.assign(manuscripts[ei],data);
  else manuscripts.push(data);
  saveData();
  closeModal('modalManu');
  renderCurrentView();
  toast('Manuscrito salvo.');
}

function deleteManu(){
  const id=document.getElementById('mId').value;
  if(!id) return;
  if(!confirm('Excluir este manuscrito?')) return;
  manuscripts=manuscripts.filter(m=>m.id!==id);
  saveData();
  closeModal('modalManu');
  if(currentView==='manu-detail') backFromManuDetail();
  else renderCurrentView();
  toast('Manuscrito excluído.');
}

// ─── CALENDÁRIO ───────────────────────────────────────────────
function renderCalendario(){
  const events=[];
  students.forEach(s=>{
    if(s.end) events.push({date:s.end,label:`Prazo — ${s.name}`,sub:`${s.type} · ${s.milestone||''}`,id:s.id});
    // bancas no log de reuniões ou milestone
    if(s.milestone&&(s.milestone.includes('Banca')||s.milestone.includes('Defesa'))){
      if(s.lastMeet) events.push({date:s.lastMeet,label:`Banca/Defesa — ${s.name}`,sub:`${s.type}`,id:s.id,isBanca:true});
    }
  });
  events.sort((a,b)=>new Date(a.date)-new Date(b.date));
  const now=Date.now();
  const el=document.getElementById('calendarList');
  if(!events.length){el.innerHTML='<div class="empty-state"><div class="empty-icon">◷</div>Nenhum prazo ou evento cadastrado.<br>Adicione datas de término nos orientandos.</div>';return;}
  el.innerHTML=events.map(e=>{
    const isPast=new Date(e.date).getTime()<now;
    const isSoon=!isPast&&(new Date(e.date).getTime()-now)<14*86400000;
    return `<div class="cal-item ${isPast?'cal-past':''} ${isSoon?'cal-soon':''}" onclick="openStudentDetail('${e.id}')">
      <div class="cal-date">${fmtDate(e.date)}</div>
      <div><div class="cal-label">${e.label}</div><div class="cal-sub">${e.sub}</div></div>
      ${isSoon?'<span class="inactivity-badge inactivity-alert" style="margin-left:auto">Em breve</span>':''}
      ${isPast?'<span class="inactivity-badge inactivity-ok" style="margin-left:auto;opacity:.5">Passado</span>':''}
    </div>`;
  }).join('');
}

// ─── ALERTAS ──────────────────────────────────────────────────
function renderAlertas(){
  const alerts=[];
  students.filter(s=>!s.encerrado).forEach(s=>{
    const d=inactivityDays(s);
    if(d>=cfg.alertDays) alerts.push({color:'var(--red)',s,msg:`<strong>${s.name}</strong> — sem contato há <strong>${d} dias</strong>. Etapa atual: ${s.milestone||'?'}`});
    else if(d>=cfg.warnDays) alerts.push({color:'var(--orange)',s,msg:`<strong>${s.name}</strong> — sem contato há <strong>${d} dias</strong>. Etapa atual: ${s.milestone||'?'}`});
    if(s.end){
      const diasPrazo=Math.floor((new Date(s.end).getTime()-Date.now())/86400000);
      if(diasPrazo>=0 && diasPrazo<=30) alerts.push({color:'var(--yellow)',s,msg:`<strong>${s.name}</strong> — prazo de conclusão em <strong>${diasPrazo} dias</strong> (${fmtDate(s.end)})`});
    }
  });
  updateAlertBadge(alerts.length);
  const el=document.getElementById('alertsList');
  if(!alerts.length){el.innerHTML='<div class="empty-state"><div class="empty-icon">✓</div>Nenhum alerta ativo. Todos os orientandos estão em dia.</div>';return;}
  el.innerHTML=alerts.map(a=>`<div class="alert-item" onclick="openStudentDetail('${a.s.id}')">
    <div class="alert-dot-wrap"><div class="alert-dot" style="background:${a.color}"></div></div>
    <div class="alert-text">${a.msg}</div>
  </div>`).join('');
}

function updateAlertBadge(n){
  if(n===undefined){
    n=students.filter(s=>!s.encerrado&&inactivityDays(s)>=cfg.warnDays).length;
    students.filter(s=>!s.encerrado&&s.end).forEach(s=>{
      const dp=Math.floor((new Date(s.end).getTime()-Date.now())/86400000);
      if(dp>=0&&dp<=30) n++;
    });
  }
  const badge=document.getElementById('alert-count');
  if(n>0){badge.style.display='inline';badge.textContent=n;}
  else badge.style.display='none';
}

// ─── CONFIG ───────────────────────────────────────────────────
function renderConfig(){
  document.getElementById('cfgGistId').value=cfg.gistId||'';
  document.getElementById('cfgToken').value=cfg.token||'';
  document.getElementById('cfgWarnDays').value=cfg.warnDays||14;
  document.getElementById('cfgAlertDays').value=cfg.alertDays||30;
}

function saveConfig(){
  cfg.gistId=document.getElementById('cfgGistId').value.trim();
  cfg.token=document.getElementById('cfgToken').value.trim();
  cfg.warnDays=parseInt(document.getElementById('cfgWarnDays').value)||14;
  cfg.alertDays=parseInt(document.getElementById('cfgAlertDays').value)||30;
  saveCfg();
  toast('Configurações salvas.');
}

async function testGist(){
  const id=document.getElementById('cfgGistId').value.trim();
  const token=document.getElementById('cfgToken').value.trim();
  if(!id||!token){toast('Preencha o Gist ID e o Token.');return;}
  try{
    const r=await fetch(`https://api.github.com/gists/${id}`,{headers:{Authorization:`token ${token}`}});
    if(r.ok){toast('✓ Conexão com Gist bem-sucedida!');}
    else toast('✗ Falha: '+(await r.json()).message);
  }catch(e){toast('✗ Erro de rede: '+e.message);}
}

function exportJSON(){
  const data={students,manuscripts};
  const a=document.createElement('a');
  a.href='data:application/json,'+encodeURIComponent(JSON.stringify(data,null,2));
  a.download='labresearch_backup.json';a.click();
}

function importJSON(input){
  const f=input.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=e=>{
    try{
      const d=JSON.parse(e.target.result);
      if(d.students) students=d.students;
      if(d.manuscripts) manuscripts=d.manuscripts;
      saveData();renderCurrentView();toast('Dados importados com sucesso.');
    }catch(e){toast('Erro ao importar JSON.');}
  };r.readAsText(f);
}

// ─── UTILS ────────────────────────────────────────────────────
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function today(){return new Date().toISOString().slice(0,10);}
function fmtDate(d){if(!d)return'—';try{const [y,m,dd]=d.split('-');return`${dd}/${m}/${y}`;}catch(e){return d;}}
function escHTML(s){if(!s)return'';const d=document.createElement('div');d.textContent=s;return d.innerHTML;}

function openModal(id){document.getElementById(id).classList.add('open');}
function closeModal(id){document.getElementById(id).classList.remove('open');}
document.querySelectorAll('.overlay').forEach(o=>o.addEventListener('click',e=>{if(e.target===o)o.classList.remove('open');}));

function toast(msg){
  const el=document.createElement('div');el.className='toast';el.textContent=msg;
  document.getElementById('toastWrap').appendChild(el);
  setTimeout(()=>el.remove(),3000);
}

// ─── INIT ─────────────────────────────────────────────────────
(async()=>{
  await loadData();
  renderDashboard();
  updateAlertBadge();
})();
</script>
